repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && uv run ruff check --fix'
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format'
        language: system
        types: [python]
        files: ^backend/

      - id: biome-check
        name: biome check
        entry: npm run lint:fix --prefix frontend
        language: system
        files: ^frontend/
        types_or: [javascript, jsx, ts, tsx, json]
        pass_filenames: false
