repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && poetry run ruff check --fix'
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && poetry run ruff format'
        language: system
        types: [python]
        files: ^backend/

      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && poetry run mypy .'
        language: system
        pass_filenames: false
        files: ^backend/

      - id: biome-check
        name: biome check
        entry: npm run lint:fix --prefix frontend
        language: system
        files: ^frontend/
        types: [text]
        pass_filenames: false

      - id: typecheck
        name: typecheck
        entry: npm run typecheck --prefix frontend
        language: system
        files: ^frontend/
        pass_filenames: false
