services:
  - type: web
    name: ai-librarian-backend
    env: python
    region: singapore
    buildCommand: |
      cd backend
      pip install uv
      uv sync
    startCommand: |
      cd backend
      uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FORCE_HTTPS
        value: "true"
      - key: DISABLE_AUTH
        value: "false"
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: METRICS_SERVER_ENABLED
        value: "true"
    healthCheckPath: /api/v1/health/
