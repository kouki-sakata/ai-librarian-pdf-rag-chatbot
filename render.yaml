services:
  - type: web
    name: ai-librarian-backend-dev
    env: python
    plan: free
    branch: main
    region: singapore
    autoDeploy: true
    buildCommand: |
      cd backend
      pip install uv
      uv sync --frozen
    startCommand: |
      cd backend
      uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # -------- Required secrets (set at import time) --------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # -------- Non-secret defaults for the dev blueprint --------
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: DISABLE_AUTH
        value: "false"
      - key: FORCE_HTTPS
        value: "true"
      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:3000","http://localhost:5173"]'
      - key: METRICS_SERVER_ENABLED
        value: "false"
    healthCheckPath: /api/v1/health/
