services:
  - type: web
    name: ai-librarian-backend
    env: python
    region: singapore
    buildCommand: |
      cd backend
      pip install uv
      uv sync
    startCommand: |
      cd backend
      uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DISABLE_AUTH
        value: "false"
    healthCheckPath: /api/v1/health
