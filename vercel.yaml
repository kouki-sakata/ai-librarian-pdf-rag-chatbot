# Vercel deployment blueprint for the Next.js frontend (dev-ready defaults)
version: 2

builds:
  - src: frontend/package.json
    use: "@vercel/next"
    config:
      rootDir: frontend

# Safe defaults for development; override in Vercel dashboard per environment.
# 本番環境のSupabase URL/キーはVercelダッシュボードで環境変数を設定してください
env:
  NEXT_PUBLIC_API_URL: http://localhost:8000
  # 開発環境用のローカルSupabase設定
  # ローカル開発時は supabase start で起動したSupabaseを使用
  NEXT_PUBLIC_SUPABASE_DEV_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_DEV_ANON_KEY: "<YOUR_SUPABASE_ANON_KEY>"

# Explicit commands for blueprint import
installCommand: npm install --prefix frontend
buildCommand: npm run build --prefix frontend
devCommand: npm run dev --prefix frontend -- --hostname 0.0.0.0 --port 3000
# No custom routes required; Next.js handles routing under /frontend
