[project]
name = "ai-librarian-backend"
version = "0.1.0"
description = "Backend for AI Librarian RAG"
authors = [
    {name = "AI Librarian",email = "ai@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.121.3,<0.122.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pypdf (>=6.3.0,<7.0.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "langchain-openai (>=1.0.3,<2.0.0)",
    "openai (>=2.8.1,<3.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "pgvector (>=0.3.5,<0.5.0)",
    "psycopg[binary] (>=3.2.3,<4.0.0)",
    "supabase (>=2.10.0,<3.0.0)",
    "opentelemetry-api (>=1.38.0,<2.0.0)",
    "opentelemetry-sdk (>=1.38.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.59b0,<0.60)",
    "opentelemetry-exporter-prometheus (>=0.45b0,<2.0.0)",
    "prometheus-client (>=0.17.1,<1.0.0)"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "locust (>=2.42.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.14.6,<0.15.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "pre-commit (>=4.5.0,<5.0.0)",
    "pytest-watch (>=4.2.0,<5.0.0)",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E402",  # Module level import not at top of file (needed for some FastAPI patterns)
    "F841",  # Local variable assigned but never used (common in TODO/stub code)
    "N806",  # Variable in function should be lowercase (allow for Mock objects in tests)
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "langchain_text_splitters.*",
    "langchain_openai.*",
    "tiktoken.*",
    "jose.*",
    "prometheus_client.*",
    "pgvector.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
